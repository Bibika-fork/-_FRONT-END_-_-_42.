<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма заказа звонка</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: #eeeeee;
        }

        /* ФИОЛЕТОВЫЙ ФОН */
        .callback-section{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #8f1b84;
        }

        /* КАРТОЧКА ФОРМЫ */
        .callback-form{
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        /* ВЕРХНИЙ БЛОК */
        .form-header{
            background: #9a1d8f;
            color: white;
            padding: 25px 30px 20px;
        }

        .form-header h2{
            font-size: 34px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .form-header p{
            font-size: 14px;
            line-height: 1.5;
        }

        /* КНОПКА ЗАКРЫТИЯ */
        .close-btn{
            position: absolute;
            top: 12px;
            right: 15px;
            border: none;
            background: transparent;
            color: white;
            font-size: 32px;
            cursor: pointer;
        }

        /* ФОРМА */
        form{
            padding: 30px;
        }

        .form-group{
            margin-bottom: 20px;
        }

        .form-group label{
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #222;
        }

        .form-group input{
            width: 100%;
            height: 46px;
            border: 1px solid #d6d6d6;
            border-radius: 3px;
            padding: 0 14px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus{
            border-color: #9a1d8f;
            box-shadow: 0 0 5px rgba(154,29,143,0.3);
        }

        /* CHECKBOX */
        .checkbox-group{
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 30px;
            font-size: 13px;
            line-height: 1.4;
            color: #555;
        }

        .checkbox-group input{
            margin-top: 3px;
            accent-color: #9a1d8f;
        }

        /* КНОПКА */
        .submit-btn{
            width: 100%;
            max-width: 260px;
            height: 52px;
            display: block;
            margin: 0 auto;
            border: none;
            border-radius: 30px;
            background: #9a1d8f;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover{
            background: #7f1675;
            transform: translateY(-2px);
        }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 480px){

            .form-header{
                padding: 20px;
            }

            .form-header h2{
                font-size: 26px;
            }

            form{
                padding: 20px;
            }

            .submit-btn{
                max-width: 100%;
            }
        }

    </style>
</head>

<body>

    <div class="callback-section">

        <div class="callback-form">

            <button class="close-btn">&times;</button>

            <div class="form-header">
                <h2>ЗАКАЗАТЬ ЗВОНОК</h2>

                <p>
                    Укажите ваши контактные данные и мы свяжемся
                    с вами в ближайшее время
                </p>
            </div>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="name">Ваше имя</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Номер телефона</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+375"
                    >
                </div>

                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="agree"
                        checked
                    >

                    <label for="agree">
                        Я даю согласие на обработку персональных данных
                    </label>

                </div>

                <button type="submit" class="submit-btn">
                    ЗАКАЗАТЬ ЗВОНОК
                </button>

            </form>

        </div>

    </div>

</body>
</html>
